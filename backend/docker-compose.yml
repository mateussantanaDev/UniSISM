services:
  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    container_name: unisism-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-unisism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-unisism}
      POSTGRES_DB: ${POSTGRES_DB:-unisism_ubs}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-unisism} -d ${POSTGRES_DB:-unisism_ubs}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    container_name: unisism-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    container_name: unisism-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-unisism}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-unisism12345}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console web (http://localhost:9001)
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  clamav:
    restart: unless-stopped
    # Opcional — ClamAV demora ~2-5min no primeiro start (baixa assinaturas).
    platform: linux/amd64
    image: clamav/clamav:latest
    container_name: unisism-clamav
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 300s

  ntfy:
    restart: unless-stopped
    # Push notifications self-hosted (open-source, MIT)
    # Console web: http://localhost:8080
    # API publish: POST http://localhost:8080/<topic>
    # Subscribe:   wss://localhost:8080/<topic>/ws  (no app)
    image: binwiederhier/ntfy:latest
    container_name: unisism-ntfy
    command:
      - serve
    environment:
      TZ: America/Recife
      NTFY_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8080}
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "false"
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_AUTH_DEFAULT_ACCESS: ${NTFY_AUTH_DEFAULT_ACCESS:-read-write}
      NTFY_ENABLE_SIGNUP: "false"
      NTFY_ENABLE_LOGIN: "true"
      NTFY_WEB_PUSH_PUBLIC_KEY: ""
      NTFY_WEB_PUSH_PRIVATE_KEY: ""
    ports:
      - "${NTFY_PORT:-8080}:80"
    volumes:
      - ntfy_cache:/var/cache/ntfy
      - ntfy_data:/var/lib/ntfy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/v1/health | grep -q healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unisism-backend
    environment:
      NODE_ENV: development
      PORT: 3333
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-unisism}:${POSTGRES_PASSWORD:-unisism}@postgres:5432/${POSTGRES_DB:-unisism_ubs}?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-prod}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      CORS_ALLOW_VERCEL_PREVIEW: ${CORS_ALLOW_VERCEL_PREVIEW:-true}
      CORS_VERCEL_PROJECT: ${CORS_VERCEL_PROJECT:-unisism}
      HTTP_KEEP_ALIVE_TIMEOUT_MS: ${HTTP_KEEP_ALIVE_TIMEOUT_MS:-65000}
      HTTP_HEADERS_TIMEOUT_MS: ${HTTP_HEADERS_TIMEOUT_MS:-66000}
      HTTP_REQUEST_TIMEOUT_MS: ${HTTP_REQUEST_TIMEOUT_MS:-300000}
      SHUTDOWN_GRACE_MS: ${SHUTDOWN_GRACE_MS:-10000}
      API_KEY: ${API_KEY:-}
      API_KEY_HEADER: ${API_KEY_HEADER:-x-api-key}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-unisism-anexos}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-unisism}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-unisism12345}
      S3_FORCE_PATH_STYLE: "true"
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310
      METRICS_ENABLED: "true"
      OUTBOX_ENABLED: "true"
      OUTBOX_INTERVAL_MS: ${OUTBOX_INTERVAL_MS:-500}
      UPLOAD_DIR: /app/uploads
      APP_RESET_SENHA_URL: ${APP_RESET_SENHA_URL:-http://localhost:5173/redefinir-senha}
      # Push notifications (ntfy.sh self-hosted)
      PUSH_PROVIDER: ${PUSH_PROVIDER:-ntfy}
      PUSH_DISPATCHER_ENABLED: ${PUSH_DISPATCHER_ENABLED:-true}
      PUSH_DISPATCHER_INTERVAL_MS: ${PUSH_DISPATCHER_INTERVAL_MS:-15000}
      NTFY_BASE_URL: ${NTFY_BASE_URL_INTERNAL:-http://ntfy}
      NTFY_AUTH_TOKEN: ${NTFY_AUTH_TOKEN:-}
      NTFY_TIMEOUT_MS: ${NTFY_TIMEOUT_MS:-10000}
      NTFY_PUBLIC_BASE_URL: ${NTFY_BASE_URL:-http://localhost:8080}
    ports:
      - "${BACKEND_PORT:-3333}:3333"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3333/v1/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    command: ["sh", "-c", "npm run start:container"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
  ntfy_cache:
  ntfy_data:
